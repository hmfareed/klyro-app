# Klyro local stack per 01-architecture § environments + 13-infrastructure.
# local: Docker Compose Postgres + Mongo + Redis + Mailhog.
# staging mirrors prod (GitHub OAuth/webhook testing). Production: Vercel + Railway/Fly + Neon + Atlas + Upstash.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: klyro
      POSTGRES_PASSWORD: klyro
      POSTGRES_DB: klyro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI http://localhost:8025

volumes:
  pgdata:
  mongodata:
